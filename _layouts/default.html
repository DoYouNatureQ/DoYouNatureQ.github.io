<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/images/Logo-2026.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css?v=2' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      {% include sidebar.html %}
    </aside>
    <main class="content">
      {{ content }}
    </main>
  </div>
  <script>
    (function () {
      var btnFirst = document.getElementById('gh-btn-first');
      var btnSecond = document.getElementById('gh-btn-second');
      var first = document.querySelector('.gh-half-first');
      var second = document.querySelector('.gh-half-second');
      function show(half) {
        first.classList.toggle('is-hidden', half !== 'first');
        second.classList.toggle('is-hidden', half !== 'second');
      }
      btnFirst.addEventListener('click', function () { show('first'); });
      btnSecond.addEventListener('click', function () { show('second'); });
    })();
  </script>
</body>
</html>
